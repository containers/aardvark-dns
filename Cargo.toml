[package]
name = "aardvark-dns"
# This version specification right below is reused by .packit.sh to generate rpm version
version = "2.1.0"
edition = "2018"
authors = ["github.com/containers"]
license = "Apache-2.0"
readme = "README.md"
description = "A container-focused DNS server"
homepage = "https://github.com/containers/aardvark-dns"
repository = "https://github.com/containers/aardvark-dns"
categories = ["virtualization"]
exclude = ["/.github/*"]
rust-version = "1.88"

[package.metadata.vendor-filter]
# This list is not exhaustive.
platforms = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "powerpc64le-unknown-linux-gnu",
             "s390x-unknown-linux-gnu", "riscv64gc-unknown-linux-gnu",
             "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl",
             ]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "~4.6.6", features = ["derive"] }
syslog = "^7.0.0"
log = "0.4.34"
hickory-server = "0.26.3"
hickory-proto = { version = "0.26.3" }
hickory-net = { version = "0.26.3", features = ["tokio"] }
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
nix = { version = "0.31.3", features = ["fs", "signal", "net"] }
libc = "0.2.189"
arc-swap = "1.9.2"
flume = "0.12.0"
inotify = "0.11.5"
futures = "0.3.34"

[build-dependencies]
chrono = "0.4.45"
